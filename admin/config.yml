# Decap CMS for the portfolio. Log in at /admin with GitHub.
backend:
  name: github
  repo: AnandaBintang/Portofolio-Website
  branch: master
  commit_messages:
    update: "content: update {{slug}}"
    uploadMedia: "content: upload {{path}}"
    deleteMedia: "content: delete {{path}}"

# For editing on your laptop: run `npx decap-server` next to the site, then open /admin locally.
local_backend: true

site_url: https://ananda-bintang.netlify.app
display_url: https://ananda-bintang.netlify.app
media_folder: assets/img/projects
public_folder: /assets/img/projects

collections:
  - name: content
    label: Content
    editor:
      preview: false
    files:
      - name: projects
        label: Projects (contact sheet)
        file: content/projects.json
        fields:
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.en.title}} · {{fields.year}}"
            hint: The first project is frame 01. Drag to reorder.
            fields:
              - { label: Slug (unique, no spaces), name: id, widget: string, pattern: ['^[a-z0-9-]+$', "lowercase letters, numbers and dashes only"] }
              - label: Type
                name: type
                widget: select
                options:
                  - { label: Client work, value: work }
                  - { label: Freelance, value: freelance }
                  - { label: Personal, value: personal }
              - { label: Year, name: year, widget: string, hint: "e.g. 2025 – 2026 or Oct 2026 – now" }
              - { label: Cover colour (used when there is no screenshot), name: color, widget: color, default: "#ffb44a" }
              - { label: Stack, name: stack, widget: list, field: { label: Tech, name: tech, widget: string } }
              - { label: Screenshots (first one is the cover), name: images, widget: list, required: false, field: { label: Image, name: image, widget: image } }
              - { label: Live demo URL, name: demo, widget: string, required: false }
              - { label: Source code URL, name: source, widget: string, required: false }
              - label: English
                name: en
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: One-line summary, name: summary, widget: string }
                  - { label: About the project, name: about, widget: text }
                  - { label: What I did, name: did, widget: list, field: { label: Point, name: point, widget: text } }
                  - { label: Note when there is no demo, name: noDemo, widget: string, required: false }
              - label: Bahasa Indonesia
                name: id_
                widget: object
                fields:
                  - { label: Judul, name: title, widget: string }
                  - { label: Peran, name: role, widget: string }
                  - { label: Ringkasan satu baris, name: summary, widget: string }
                  - { label: Tentang project, name: about, widget: text }
                  - { label: Yang saya kerjakan, name: did, widget: list, field: { label: Poin, name: point, widget: text } }
                  - { label: Catatan jika tidak ada demo, name: noDemo, widget: string, required: false }

      - name: experience
        label: Career (tour dates)
        file: content/experience.json
        fields:
          - label: Jobs
            name: experience
            widget: list
            summary: "{{fields.role_en}} · {{fields.company}} ({{fields.start}} → {{fields.end}})"
            hint: Sorted by start date on the site. Leave "End" empty for the job you have now.
            fields:
              - { label: Slug, name: id, widget: string }
              - { label: Role (English), name: role_en, widget: string }
              - { label: Role (Bahasa Indonesia), name: role_id, widget: string }
              - { label: Company, name: company, widget: string }
              - { label: Client (optional), name: client, widget: string, required: false }
              - { label: Place (optional), name: place, widget: string, required: false, hint: "e.g. Jakarta, hybrid" }
              - { label: Start (YYYY-MM), name: start, widget: string, pattern: ['^\d{4}-\d{2}$', "use YYYY-MM, e.g. 2026-10"] }
              - { label: End (YYYY-MM, empty = now), name: end, widget: string, required: false, pattern: ['^(\d{4}-\d{2})?$', "use YYYY-MM or leave empty"] }
              - { label: Summary (English), name: summary_en, widget: text }
              - { label: Ringkasan (Bahasa Indonesia), name: summary_id, widget: text }
