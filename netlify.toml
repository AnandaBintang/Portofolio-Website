# Plain static site: no build step, publish the repository root.
[build]
  command = "echo 'Static site, nothing to build'"
  publish = "."

[build.environment]
  # The site used to be a Next.js / Vite app; keep Netlify's Next plugin out of the way.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/assets/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
